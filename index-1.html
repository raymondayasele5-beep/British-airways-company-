<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }
    .card {
      width: min(90%, 420px);
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }
    h1 { margin-top: 0; color: #222; }
    .number {
      display: block;
      margin: 25px 0;
      font-size: 28px;
      font-weight: bold;
      color: #111;
    }
    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact</h1>
    <div class="number">09040845088</div>
    <a href="https://wa.me/2349040845088">Chat on WhatsApp</a>
  </div>
</body>
</html>
